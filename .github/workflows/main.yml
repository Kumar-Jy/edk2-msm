name: msm-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Image Build
    runs-on: ubuntu-24.04

    strategy:
      max-parallel: 4
      matrix:
        device:
          - beryllium-tianma
          - beryllium-ebbg
          - beryllium-tianma-fts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wine wine64 libsdl2-dev build-essential uuid-dev clang llvm iasl nasm gcc-aarch64-linux-gnu abootimg python3-pil python3-git gettext

      - name: Build an image for ${{ matrix.device }}
        run: |
          ./build.sh --device ${{ matrix.device }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device }}
          path: ./*.img
